<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-yxJar5iz80CFBfIbsh2zauhZ+i5oDqT+gnUBYgqCwx4='; style-src 'sha256-31DCydCfKeze5bskz/4EFzXsCImfaG4DlT8b97xsQo0='; base-uri 'none'; form-action 'none'">
<title>Vitals - Withings sign-in</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #faf7f5;
  --fg: #1f1a1a;
  --muted: #6b6161;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161212;
    --fg: #f3eeee;
    --muted: #a89e9e;
  }
}
body {
  margin: 0;
  padding: 3rem 1rem;
  background: var(--bg);
  color: var(--fg);
  font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main {
  max-width: 28rem;
  margin: 0 auto;
}
h1 {
  margin: 0 0 0.5rem;
  font-size: 1.5rem;
}
p {
  margin: 0;
  color: var(--muted);
}
</style>
</head>
<body>
<main>
  <h1>Vitals</h1>
  <p id="status">Taking you back to your Vitals server…</p>
  <noscript><p>Turn on JavaScript to finish connecting Withings to Vitals.</p></noscript>
</main>
<script>
// Withings sends the browser here after sign-in, with ?code=...&state=... (or ?error=...&state=...).
// The Vitals server made the state: "<random>.<its /withings/callback/ address in URL-safe base64>".
// This page sends the whole query on to that address, but only to a private one (home network or
// Tailscale) and only to that path. The server then checks the state against the session that
// started the sign-in. Nothing else happens here: no data, no secrets, no other requests.
(function () {
  "use strict";

  var query = window.location.search;
  var state = new URLSearchParams(query).get("state") || "";
  var dot = state.indexOf(".");
  if (dot < 1) return stop("This page only works while connecting Withings to Vitals.");

  var target;
  try {
    var encoded = state.slice(dot + 1).replace(/-/g, "+").replace(/_/g, "/");
    while (encoded.length % 4) encoded += "=";
    target = new URL(window.atob(encoded));
  } catch (error) {
    return stop("The sign-in came back without a Vitals address.");
  }
  if (!allowed(target)) return stop("Not forwarding the sign-in: that isn't a Vitals server on a private address.");
  window.location.replace(target.protocol + "//" + target.host + target.pathname + query);

  function stop(message) {
    document.getElementById("status").textContent = message;
  }

  function allowed(url) {
    if (url.protocol !== "http:" && url.protocol !== "https:") return false;
    if (url.username || url.password || url.search || url.hash) return false;
    return url.pathname === "/withings/callback/" && isPrivate(url.hostname);
  }

  // 10.x, 172.16-31.x, 192.168.x, 127.x, Tailscale's 100.64-127.x, localhost and *.ts.net names.
  function isPrivate(host) {
    if (host === "localhost" || /\.ts\.net$/.test(host)) return true;
    var parts = host.split(".");
    if (parts.length !== 4) return false;
    var n = [];
    for (var i = 0; i < 4; i++) {
      if (!/^\d{1,3}$/.test(parts[i]) || +parts[i] > 255) return false;
      n.push(+parts[i]);
    }
    return n[0] === 10 || n[0] === 127 ||
      (n[0] === 172 && n[1] >= 16 && n[1] <= 31) ||
      (n[0] === 192 && n[1] === 168) ||
      (n[0] === 100 && n[1] >= 64 && n[1] <= 127);
  }
})();
</script>
</body>
</html>
